const STOPWORDS=new Set(['요청','개선','관련','문제','검토','부탁','합니다','대한','용인시','시민','지역','사업','반대','찬성','요구','청원','설치','확대','위한','및','추진','계획','주민','공식','개발']);
const splitTerms=(raw)=>{
 const text=String(raw||'').toLowerCase().replace(/[^가-힣a-z0-9]+/g,' ');
 return [...new Set(text.split(/\s+/).filter(w=>w.length>=2&&!STOPWORDS.has(w)))];
};
const overlap=(a,b)=>{
 const x=new Set(a),y=new Set(b),intersection=[...x].filter(t=>y.has(t));
 return {value:intersection.length/Math.max(1,new Set([...x,...y]).size),terms:intersection};
};
const anchoredRelation=(a,b)=>{
 const id=String(b['청원ID']);
 return (a['유사청원ID']||'').split(';').includes(id) ||
        (b['유사청원ID']||'').split(';').includes(String(a['청원ID']));
};
const detectPosition=(p)=>{
 const title=(p['청원제목_원문']||'')+' '+(p['유사관계_판정']||'');
 if(/반대/.test(p['청원제목_원문']||''))return '반대 의견';
 if(/설치건|설치 요청|설치 촉구|설치 찬성|조성 요청|설치해/.test(p['청원제목_원문']||''))return '설치 요청 의견';
 return '의견 구분 확인 필요';
};
function similarity(a,b){
 if(a['청원ID']===b['청원ID'])return null;
 const title=overlap(splitTerms(a['청원제목_원문']),splitTerms(b['청원제목_원문']));
 const place=overlap(splitTerms(a['지역_청원내용기반']),splitTerms(b['지역_청원내용기반']));
 const key=overlap(splitTerms(a['공통현안키']),splitTerms(b['공통현안키']));
 const bothCategory=a['분야']===b['분야'];
 const anchored=anchoredRelation(a,b);
 // Never infer a shared project solely from a similar title.
 const points=Math.round(Math.min(100,100*(title.value*.35+place.value*.2+key.value*.35+(bothCategory?.1:0))));
 const signals=[];
 if(key.terms.length)signals.push('공통 현안어: '+key.terms.join(', '));
 if(place.terms.length)signals.push('지역어: '+place.terms.join(', '));
 if(title.terms.length)signals.push('제목어: '+title.terms.join(', '));
 if(bothCategory)signals.push('동일 분야');
 if(anchored)signals.unshift('기존 조사 CSV에 관련 청원으로 등록');
 const group=anchored?'조사자료 기반 연결':points>=20?'자동 유사 후보':'낮은 관련성';
 return {target:b,score:points,anchored,group,reasons:signals};
}

    {detailTab==='후속조치'&&<div className="space-y-3"><h2 className="font-bold text-navy-800">후속 행정조치 추적</h2><Info>현재 CSV 조사 결과: <b>{current['행정조치_공개표시']}</b>. 공식 답변이 있어도 실제 행정조치 완료·진행을 확인할 근거가 부족합니다.</Info><div className="rounded-lg border-l-4 border-slate-400 bg-slate-50 p-3"><div className="text-xs text-slate-500">후속 검증 과제</div><div className="mt-1 text-sm">{current['후속_검증과제']||current['추가_후속확인사항']||'추가 확인 필요'}</div></div><div className="rounded-lg bg-slate-50 p-3 text-sm"><b>상태근거</b><p className="mt-1 text-slate-600">{current['상태근거수준']}</p></div><div className="text-sm text-slate-600">공식 답변 게시 이후의 개별 조치 내역을 확인된 날짜별로 표시할 자료가 없어 가상의 처리 타임라인을 생성하지 않았습니다.</div></div>}
    {detailTab==='공식 답변'&&<div className="space-y-3"><h2 className="font-bold text-navy-800">공식 답변 핵심 요약</h2><p className="whitespace-pre-wrap rounded-lg bg-slate-50 p-3 text-sm leading-relaxed">{current['공식답변_핵심요약']||'답변 요약 미입력'}</p><p className="text-xs text-slate-500">CSV 조사요약이며 공식 답변 전문이 아닙니다. 정확한 표현은 원본을 확인하세요.</p><a className="text-blue-700 underline text-sm" href={current['원본URL']} target="_blank" rel="noopener noreferrer">공식 원문으로 이동 ↗</a></div>}
    {detailTab==='관련자료'&&<div className="space-y-3"><h2 className="font-bold text-navy-800">행정자료·청원 연계 ({docs.length}건)</h2><p className="text-sm text-slate-600">청원과 같은 현안을 언급한 자료와 유사 청원입니다. 직접 언급 여부와 실제 사업 완료는 별개입니다.</p><div className="flex flex-wrap gap-2"><button className={'rounded-lg px-3 py-1.5 text-xs '+(typeFilter==='전체'?'bg-navy-700 text-white':'bg-slate-100')} onClick={()=>setTypeFilter('전체')}>전체</button>{[...new Set(docs.map(d=>d['자료유형']))].map(t=><button key={t} className={'rounded-lg px-3 py-1.5 text-xs '+(typeFilter===t?'bg-navy-700 text-white':'bg-slate-100')} onClick={()=>setTypeFilter(t)}>{t}</button>)}</div>{docs.filter(d=>typeFilter==='전체'||d['자료유형']===typeFilter).map((d,i)=><div key={i} className="space-y-2 rounded-lg border p-3"><div className="flex flex-wrap gap-1"><Tag label={d['자료유형']} color="#1f3c6e"/><Tag label={d['연결판정']} color="#64748b"/></div><b className="text-sm">{d['자료명']}</b><p className="text-sm text-slate-600">{d['연결설명']}</p><p className="text-xs text-amber-700">{d['주의사항']}</p>{urlOk(d['자료URL'])&&<a href={d['자료URL']} target="_blank" rel="noopener noreferrer" className="break-all text-xs text-blue-700 underline">원본 자료 보기 ↗</a>}</div>)}{docs.length===0&&<p className="text-sm text-slate-500">연결 데이터가 없습니다.</p>}</div>}
    {detailTab==='유사청원'&&<div className="space-y-3"><h2 className="font-bold text-navy-800">유사·반복 청원 통합 조회</h2><div className="text-sm text-slate-600">공통 현안: <b>{current['공통현안키']}</b></div><div className="text-xs text-slate-500">{current['유사관계_판정']||'관계 미기재'}</div>{(current['유사청원ID']||'').split(';').filter(Boolean).map(id=>{const target=byId(id);return <div key={id} className="rounded-lg border p-3">{target?<button onClick={()=>choose(id)} className="text-left font-semibold text-blue-800 underline">#{id} · {target['청원제목_원문']}</button>:<p className="text-sm font-medium">관련 청원 #{id} — 현재 10건 표본에는 미포함</p>}<a href={'https://www.yongin.go.kr/citizen/ctznPetit/BD_selectCtznPetit.do?q_petitSn='+encodeURIComponent(id)} target="_blank" rel="noopener noreferrer" className="mt-1 block text-xs text-blue-700 underline">공식 상세페이지 열기 ↗</a></div>})}<button onClick={()=>{setCompareId((current['유사청원ID']||'').split(';').find(id=>byId(id))||'3746');jump('similar')}} className="rounded-lg bg-navy-700 px-4 py-2 text-sm text-white">유사도 분석·통합 비교 열기 →</button>{!current['유사청원ID']&&<p className="text-sm text-slate-500">이번 조사에서 연결된 유사 청원이 없습니다.</p>}</div>}
    {detailTab==='이첩 안내'&&<div className="space-y-2"><h2 className="font-bold text-navy-800">타 기관 이첩 여부</h2><Tag label="확인되지 않음" color="#64748b"/><p className="text-sm text-slate-600">CSV 조사 결과: {current['이첩여부_확인결과']}. 이첩하지 않았다는 뜻도 아닙니다. 실제 이첩기관·사유·처리경로는 공개 근거가 확보되면 추가합니다.</p></div>}
   </section><aside className="space-y-3"><div className={BOX}><h2 className="mb-3 font-bold text-navy-800">자료 연결 요약</h2><div className="space-y-2 text-sm">{[['전체 연계 레코드',docs.length],['행정 문서·답변 내 근거',actualDocs.length],['유사·관련 청원 링크',linkedPetitions.length]].map(([k,v])=><div key={k} className="flex justify-between border-b pb-2"><span>{k}</span><b>{v}건</b></div>)}</div><p className="mt-3 text-xs text-slate-500">같은 회의록이 여러 청원과 연결될 수 있어 건수 중복이 발생합니다.</p></div><div className={BOX}><h2 className="font-bold text-navy-800">담당부서·목표기한</h2><p className="mt-2 text-sm text-slate-600">해당 CSV에서 검증된 담당부서 및 공식 목표 기한 필드가 확보되지 않았습니다. 임의로 채우지 않습니다.</p></div><div className={BOX}><h2 className="font-bold text-navy-800">원본·검증</h2><p className="mt-2 text-xs text-slate-500">출처: {current['자료출처']}<br/>연계수준: {current['행정자료_연결수준']}<br/>조사기준일: {current['조사기준일']}</p></div></aside></div>
  </>}
  {page==='similar'&&<>
   <div className="flex flex-wrap items-start justify-between gap-3"><div><h1 className="text-2xl font-bold text-navy-800">유사·반복 청원 통합 분석</h1><p className="mt-1 text-sm text-slate-600">공식 청원 10건의 지역·제목·현안어 비교 및 기존 조사 연결관계 조회</p></div><span className="rounded-lg border border-amber-300 bg-amber-50 px-3 py-2 text-xs font-bold text-amber-900">규칙 기반 자동 유사도 시연 · LLM 미연동</span></div>
   <Info>데시딤의 시민 제안–결과 연결 방식을 참고한 시제품입니다. 자동 추천은 문서나 사업의 동일성을 확정하지 않습니다. 기존 CSV의 관련 청원 표시도 담당기관의 공식 연계 승인을 뜻하지 않습니다. 반대 의견은 별개의 제안으로 보존합니다.</Info>
   <div className="grid gap-3 lg:grid-cols-[minmax(0,1fr)_320px]"><section className={BOX}>
     <label className="block text-sm font-bold text-navy-800">기준 청원</label><select value={selected} onChange={e=>{setSelected(e.target.value);const first=rankSimilar(byId(e.target.value))[0];if(first)setCompareId(first.target['청원ID'])}} className="mt-1 w-full rounded-lg border p-2 text-sm">{P.map(p=><option key={p['청원ID']} value={p['청원ID']}>#{p['청원ID']} · {p['청원제목_원문']}</option>)}</select>
     {current&&<div className="mt-3 rounded-lg bg-slate-50 p-3"><div className="font-semibold text-navy-800">{current['청원제목_원문']}</div><div className="mt-2 flex flex-wrap gap-2"><Tag label={current['공식청원상태']} color="#1f3c6e"/><StatusTag p={current}/><Tag label={detectPosition(current)} color="#64748b"/></div><p className="mt-2 text-xs text-slate-600">{current['지역_청원내용기반']} · {current['분야']} · {current['공통현안키']}</p><a className="mt-2 inline-block text-xs text-blue-700 underline" href={current['원본URL']} target="_blank" rel="noopener noreferrer">공식 청원 원문 ↗</a></div>}
     <div className="mt-4 flex items-center justify-between"><h2 className="font-bold text-navy-800">추천된 관련 청원</h2><label className="flex items-center gap-1.5 text-xs"><input type="checkbox" checked={onlyAnchored} onChange={e=>setOnlyAnchored(e.target.checked)}/>조사자료 기반만</label></div>
     <div className="mt-2 space-y-2">{similar.filter(c=>!onlyAnchored||c.anchored).filter(c=>c.anchored||c.score>=20).map(c=><button key={c.target['청원ID']} onClick={()=>setCompareId(c.target['청원ID'])} className={'w-full rounded-xl border p-3 text-left hover:border-blue-500 '+(compareId===c.target['청원ID']?'border-blue-500 bg-blue-50':'border-slate-200')}>
        <div className="flex items-center justify-between gap-2"><div className="flex flex-wrap gap-1"><Tag label={c.group} color={c.anchored?'#047857':'#8b5cf6'}/><Tag label={detectPosition(c.target)} color="#64748b"/></div><span className="text-xs font-bold text-navy-800">유사도 지표 {c.score}/100</span></div>
        <div className="mt-2 text-sm font-semibold">#{c.target['청원ID']} · {c.target['청원제목_원문']}</div><p className="mt-1 text-xs text-slate-500">{c.reasons.join(' · ')||'설명 가능한 일치 근거 부족'}</p>
      </button>)}{!similar.some(c=>c.anchored||c.score>=20)&&<p className="rounded-lg bg-slate-50 p-4 text-sm text-slate-500">표본 10건 내에서 뚜렷한 관련 후보가 없습니다. 연관 청원이 존재하지 않는다는 뜻은 아닙니다.</p>}</div>
    </section>
    <aside className="space-y-3"><section className={BOX}><h2 className="font-bold text-navy-800">이번 표본 내 연결 현황</h2><div className="mt-2 text-3xl font-bold text-navy-800">{similar.filter(c=>c.anchored).length}<span className="ml-2 text-sm font-normal text-slate-500">건 · 조사자료 기반</span></div><p className="mt-2 text-xs text-slate-600">자료에 연결된 외부 청원도 있으며, 이 수치는 현재 10건 내부의 연결만 집계합니다.</p></section>
     <section className={BOX}><h2 className="font-bold text-navy-800">분석 원칙</h2><ul className="mt-2 list-disc space-y-2 pl-4 text-xs text-slate-600"><li>기존 CSV 연계관계를 자동 점수보다 우선 표시</li><li>지역, 청원 제목, 공통 현안어의 중복을 근거로 계산</li><li>숫자는 유사도 지표이지 동일 사업 확률이 아님</li><li>담당자 검증 전 정책·사업 연계를 확정하지 않음</li><li>모든 청원의 원문과 찬반 입장을 개별 보존</li></ul></section>
    </aside></div>
   {current&&compare&&<section className={BOX}><div className="flex flex-wrap items-center justify-between gap-2"><h2 className="text-lg font-bold text-navy-800">두 청원 나란히 비교</h2><select value={compareId} onChange={e=>setCompareId(e.target.value)} className="max-w-full rounded-lg border p-2 text-sm">{P.filter(p=>p['청원ID']!==current['청원ID']).map(p=><option key={p['청원ID']} value={p['청원ID']}>#{p['청원ID']} · {p['청원제목_원문']}</option>)}</select></div>
    <div className="mt-3 grid gap-3 md:grid-cols-2">{[current,compare].map(p=><div key={p['청원ID']} className="rounded-xl border border-slate-200 p-4"><div className="flex flex-wrap gap-1"><Tag label={'청원 #'+p['청원ID']} color="#1f3c6e"/><Tag label={detectPosition(p)} color="#64748b"/></div><h3 className="mt-2 font-bold text-navy-800">{p['청원제목_원문']}</h3><dl className="mt-3 space-y-2 text-sm"><div><dt className="text-xs text-slate-500">지역·분야</dt><dd>{p['지역_청원내용기반']} / {p['분야']}</dd></div><div><dt className="text-xs text-slate-500">공통 현안</dt><dd>{p['공통현안키']}</dd></div><div><dt className="text-xs text-slate-500">공식 답변 요약</dt><dd className="rounded-lg bg-slate-50 p-2">{p['공식답변_핵심요약']}</dd></div><div><dt className="text-xs text-slate-500">후속정보</dt><dd>{p['행정조치_공개표시']}</dd></div></dl><a className="mt-3 inline-block text-sm text-blue-700 underline" href={p['원본URL']} target="_blank" rel="noopener noreferrer">원본 보기 ↗</a><button onClick={()=>choose(p['청원ID'])} className="ml-3 mt-3 rounded-lg bg-navy-700 px-3 py-2 text-xs text-white">상세 보기</button></div>)}</div>
    <div className="mt-3 rounded-lg bg-blue-50 p-3 text-sm text-blue-900"><b>연관성 근거:</b> {similarity(current,compare)?.reasons.join(' · ')||'설명 가능한 일치 근거 부족'}<br/><b>처리 원칙:</b> 같은 현안으로 추천되더라도 각 청원의 요구와 공식 답변은 개별 유지합니다.</div>
    <div className="mt-4"><h3 className="font-bold text-navy-800">두 청원에 연결된 공개자료</h3><div className="mt-2 space-y-2">{[...new Map([...relatedRows(current['청원ID']),...relatedRows(compare['청원ID'])].map(d=>[(d['자료URL']||'')+'|'+d['자료명'],d])).values()].map((d,i)=><div key={i} className="rounded-lg border p-3 text-sm"><div className="flex flex-wrap gap-2"><Tag label={d['자료유형']} color="#1f3c6e"/><span className="text-xs text-slate-500">{d['연결판정']}</span></div><p className="mt-1 font-semibold">{d['자료명']}</p><p className="mt-1 text-xs text-slate-600">{d['연결설명']}</p>{urlOk(d['자료URL'])&&<a className="mt-1 block break-all text-xs text-blue-700 underline" href={d['자료URL']} target="_blank" rel="noopener noreferrer">근거 링크 확인 ↗</a>}</div>)}</div></div>
   </section>}
  </>}
  {page==='accountability'&&<Accountability openPet={choose}/> }
  {page==='stats'&&<><h1 className="text-2xl font-bold text-navy-800">분야·지역별 통계</h1><Info>본 통계는 용인시 전체 통계가 아니라 공식 답변이 게시된 청원 10건을 선정한 조사 표본 기준입니다. '조치 완료율'은 산출하지 않습니다.</Info><div className="grid gap-3 md:grid-cols-2"><section className={BOX}><h2 className="mb-4 font-bold text-navy-800">분야별 건수</h2>{CATS.map(c=>{const n=P.filter(p=>p['분야']===c).length;return <button key={c} onClick={()=>{setCategory(c);jump('list')}} className="mb-4 flex w-full items-center gap-2 text-sm"><span className="w-28 text-left">{c}</span><Bar value={n} max={P.length}/><b>{n}</b></button>})}</section><section className={BOX}><h2 className="mb-4 font-bold text-navy-800">지역별 건수</h2>{GUS.map(g=>{const n=P.filter(p=>classifyRegion(p)===g).length;return <button key={g} onClick={()=>{setDistrict(g);jump('list')}} className="mb-4 flex w-full items-center gap-2 text-sm"><span className="w-28 text-left">{g}</span><Bar value={n} max={P.length}/><b>{n}</b></button>})}</section></div><section className={BOX}><h2 className="mb-3 font-bold text-navy-800">원본 집계 CSV 검증</h2><div className="overflow-x-auto"><table className="min-w-[620px] w-full text-sm"><thead><tr className="border-b text-left text-xs text-slate-500"><th className="p-2">지표</th><th>구분</th><th>건수</th><th>설명</th></tr></thead><tbody>{SUMMARY.map((x,i)=><tr key={i} className="border-b"><td className="p-2">{x['지표']}</td><td>{x['구분']}</td><td>{x['건수']}</td><td className="text-xs text-slate-500">{x['설명']}</td></tr>)}</tbody></table></div></section></>}
 </main><footer className="border-t p-4 text-center text-xs text-slate-500">두드림 TRACK · 독립 공모전용 시제품 · 공개 청원 및 연결 자료 CSV 3종 내장 · 배경지도 © OpenStreetMap 기여자</footer></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script></body></html>
